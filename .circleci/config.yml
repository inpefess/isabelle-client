version: 2.1
jobs:
  build-and-test:
    docker:
      - image: inpefess/multipython:3.15
    steps:
      - checkout
      - run:
          name: use tox
          command: |
            pip install tox
            pyenv local 3.11.18 3.12.16 3.13.18 3.14.10
            tox run
      - run:
          name: upload data to codecov
          command: |
            bash <(curl -s https://codecov.io/bash) -X gcov -X coveragepy
      - store_artifacts:
          path: build
      - store_test_results:
          path: test-results
workflows:
  main:
    jobs:
      - build-and-test
